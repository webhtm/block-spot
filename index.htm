<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Block Spot</title>
    <style>
        :root {
            /* Theme */
            --bg-grad: radial-gradient(circle at 50% 50%, #1e102d 0%, #000000 100%);
            --panel: rgba(15, 15, 15, 0.9);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.5);
            --green: #10b981;
            --red: #f43f5e;
            
            /* Scaling */
            --grid-size: 4;
            --board-dim: min(44vw, 58vh);
            --gap: calc(18px / var(--grid-size));
            --radius: calc(22px / var(--grid-size));
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-grad);
            color: var(--text);
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; }

        .view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .view.active { display: flex; }

        /* Main Menu */
        h1 {
            font-size: clamp(2.5rem, 9vh, 4rem);
            font-weight: 900;
            margin-bottom: 5px;
            letter-spacing: -2px;
            background: #fff;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc { color: var(--text-dim); margin-bottom: 30px; font-size: 1rem; letter-spacing: 1px; }

        .btn-list { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }

        .btn {
            background: var(--panel);
            color: #fff;
            border: 2px solid var(--btn-c, var(--border));
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(10px);
            text-transform: uppercase;
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px -5px var(--btn-c); }
        .btn:active { transform: scale(0.97); }

        .btn-l1 { --btn-c: #10b981; }
        .btn-l2 { --btn-c: #06b6d4; }
        .btn-l3 { --btn-c: #3b82f6; }
        .btn-l4 { --btn-c: #f59e0b; }
        .btn-l5 { --btn-c: #f97316; }
        .btn-l6 { --btn-c: #f43f5e; }

        .btn-flat { background: transparent; border: 1px dashed #444; margin-top: 15px; font-size: 0.9rem; color: var(--text-dim); --btn-c: transparent; }

        /* Game UI */
        .hud {
            width: 95%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: auto 1fr 1fr 1fr;
            align-items: center;
            gap: 20px;
            padding: 15px 30px;
            background: var(--panel);
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-top: 10px;
            margin-bottom: auto;
        }

        .nav { display: flex; gap: 10px; }
        .nav-btn {
            width: 44px; height: 44px; background: #222; border: 1px solid #333;
            border-radius: 10px; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

        .stat { display: flex; flex-direction: column; align-items: center; }
        .label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 800; }
        .num { font-size: 1.4rem; font-weight: 900; }

        /* Boards */
        .game-area {
            flex: 1; display: flex; align-items: center; justify-content: center;
            gap: clamp(15px, 8vw, 100px); width: 100%; padding: 20px 0;
        }

        .board {
            width: var(--board-dim); height: var(--board-dim);
            display: grid; grid-template-columns: repeat(var(--grid-size), 1fr);
            grid-template-rows: repeat(var(--grid-size), 1fr);
            gap: var(--gap); padding: 12px; background: var(--panel);
            border-radius: 20px; border: 2px solid var(--border); position: relative;
        }

        #play-board { animation: pulse 4s infinite ease-in-out; }
        @keyframes pulse {
            0%, 100% { border-color: var(--border); box-shadow: 0 0 10px transparent; }
            50% { border-color: var(--accent); box-shadow: 0 0 40px var(--accent-glow); }
        }

        .block { width: 100%; height: 100%; border-radius: var(--radius); }
        .active-block { cursor: pointer; transition: transform 0.1s; }
        .active-block:active { transform: scale(0.9); }

        /* Effects */
        #flash { position: absolute; inset: 0; background: rgba(244, 63, 94, 0.4); display: none; z-index: 10; border-radius: 18px; }
        .pop { animation: popOut 0.5s ease-out forwards; }
        @keyframes popOut { 0% { transform: scale(1); filter: brightness(3); } 100% { transform: scale(0.7); opacity: 0.1; } }
        .shake { animation: shakeEffect 0.4s; }
        @keyframes shakeEffect { 0%, 100% { transform: translate(0,0); } 20%, 60% { transform: translate(-5px,0); } 40%, 80% { transform: translate(5px,0); } }

        /* 100% FULL SCREEN RESULTS */
        .results-screen {
            background: var(--bg-grad);
            width: 100vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            backdrop-filter: blur(40px);
        }

        .results-content { width: 100%; max-width: 900px; display: flex; flex-direction: column; height: 100%; }

        .score-list {
            flex: 1; margin: 30px 0; overflow-y: auto; background: rgba(255,255,255,0.03);
            border-radius: 20px; padding: 20px; border: 1px solid var(--border);
        }
        .score-list::-webkit-scrollbar { width: 4px; }
        .score-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #222; font-size: 1.1rem; }
        .row:last-child { border: none; }

        @media (max-aspect-ratio: 1/1) {
            :root { --board-dim: min(92vw, 36vh); }
            .game-area { flex-direction: column; gap: 15px; }
            .hud { width: 92vw; padding: 12px 15px; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Menu -->
    <div id="scr-menu" class="view active">
        <h1>Block Spot</h1>
        <p class="desc">Spot the different block</p>
        <div class="btn-list">
            <button class="btn btn-l1" onclick="game.start(0)">Level 1</button>
            <button class="btn btn-l2" onclick="game.start(1)">Level 2</button>
            <button class="btn btn-l3" onclick="game.start(2)">Level 3</button>
            <button class="btn btn-l4" onclick="game.start(3)">Level 4</button>
            <button class="btn btn-l5" onclick="game.start(4)">Level 5</button>
            <button class="btn btn-l6" onclick="game.start(5)">Level 6</button>
            <button class="btn btn-flat" onclick="game.showHistory()">Scores</button>
        </div>
    </div>

    <!-- Play -->
    <div id="scr-play" class="view" style="justify-content: flex-start;">
        <div class="hud">
            <div class="nav">
                <button class="nav-btn" onclick="game.quit()" title="Menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
                </button>
                <button class="nav-btn" onclick="game.restart()" title="Reset">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                </button>
            </div>
            <div class="stat"><span class="label">Stage</span><span id="ui-stage" class="num">1</span></div>
            <div class="stat"><span id="ui-time" class="num">00:00</span><span class="label">Time</span></div>
            <div class="stat" style="align-items: flex-end;"><span class="label">Points</span><span id="ui-pts" class="num" style="color: var(--green);">0</span></div>
        </div>

        <div class="game-area" id="ui-container">
            <div id="ref-board" class="board"></div>
            <div id="play-board" class="board"><div id="flash"></div></div>
        </div>
    </div>

    <!-- Results -->
    <div id="scr-results" class="view" style="padding: 0;">
        <div class="results-screen">
            <div class="results-content">
                <h1 id="status-text">Finished</h1>
                
                <div id="sum-box" style="text-align:center; margin-top: 20px;">
                    <span class="label">Final Score</span>
                    <h1 id="ui-final" style="color: var(--accent); font-size: 5rem; margin: 0;">0</h1>
                </div>

                <div id="ui-list" class="score-list"></div>

                <div style="display: flex; gap: 15px; width: 100%; margin-top: auto;">
                    <button id="btn-again" class="btn btn-l3" style="flex: 1;" onclick="game.restart()">Play Again</button>
                    <button class="btn btn-flat" style="flex: 1; border-style: solid; margin-top: 0;" onclick="game.quit()">Menu</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    class GameEngine {
        constructor() {
            this.lvls = [
                { grid: 4, diffs: 1, time: 45, key: 'L1' },
                { grid: 6, diffs: 2, time: 60, key: 'L2' },
                { grid: 8, diffs: 3, time: 75, key: 'L3' },
                { grid: 10, diffs: 4, time: 90, key: 'L4' },
                { grid: 12, diffs: 6, time: 105, key: 'L5' },
                { grid: 14, diffs: 8, time: 120, key: 'L6' }
            ];
            this.palette = ['#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e','#10b981','#06b6d4','#3b82f6','#6366f1','#8b5cf6','#a855f7','#d946ef','#ec4899','#f43f5e','#ffffff'];
            this.mode = 0; this.stage = 1; this.score = 0; this.seconds = 0;
            this.clock = null; this.ans = []; this.found = 0; this.live = false;
        }

        nav(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        quit() {
            if (this.live && this.score > 0) this.save();
            clearInterval(this.clock); this.live = false;
            this.nav('scr-menu');
        }

        restart() { this.start(this.mode); }

        start(idx) {
            this.mode = idx; this.stage = 1; this.score = 0;
            this.seconds = this.lvls[idx].time; this.live = true;
            document.documentElement.style.setProperty('--grid-size', this.lvls[idx].grid);
            this.nav('scr-play'); this.build(); this.runTimer();
        }

        build() {
            const ref = document.getElementById('ref-board');
            const play = document.getElementById('play-board');
            ref.innerHTML = '';
            const flash = document.getElementById('flash');
            play.innerHTML = ''; play.appendChild(flash);
            
            document.getElementById('ui-stage').innerText = this.stage;
            document.getElementById('ui-pts').innerText = this.score;

            this.found = 0; this.ans = [];
            const cfg = this.lvls[this.mode];
            const total = cfg.grid * cfg.grid;
            const colors = [];

            for(let i=0; i < total; i++) {
                const c = this.palette[Math.floor(Math.random() * this.palette.length)];
                colors.push(c);
                const d = document.createElement('div');
                d.className = 'block'; d.style.backgroundColor = c;
                ref.appendChild(d);
            }

            while(this.ans.length < cfg.diffs) {
                const r = Math.floor(Math.random() * total);
                if(!this.ans.includes(r)) this.ans.push(r);
            }

            for(let i=0; i < total; i++) {
                let c = colors[i];
                if(this.ans.includes(i)) {
                    let alt = c;
                    while(alt === c) alt = this.palette[Math.floor(Math.random() * this.palette.length)];
                    c = alt;
                }
                const d = document.createElement('div');
                d.className = 'block active-block';
                d.id = `b-${i}`; d.style.backgroundColor = c;
                d.onclick = () => this.tap(i);
                play.appendChild(d);
            }
        }

        tap(i) {
            if(!this.live) return;
            if(this.ans.includes(i)) {
                const el = document.getElementById(`b-${i}`);
                if(!el.classList.contains('pop')) {
                    el.classList.add('pop'); this.found++;
                    this.score += (this.mode + 1) * 100;
                    document.getElementById('ui-pts').innerText = this.score;
                    if(this.found === this.lvls[this.mode].diffs) {
                        this.stage++; this.seconds += 5;
                        setTimeout(() => this.build(), 300);
                    }
                }
            } else { this.fail(); }
        }

        fail() {
            this.seconds = Math.max(0, this.seconds - 4); this.updateTime();
            const flash = document.getElementById('flash');
            const ui = document.getElementById('ui-container');
            flash.style.display = 'block'; ui.classList.add('shake');
            setTimeout(() => { flash.style.display = 'none'; ui.classList.remove('shake'); }, 350);
        }

        runTimer() {
            if(this.clock) clearInterval(this.clock);
            this.updateTime();
            this.clock = setInterval(() => {
                this.seconds--; this.updateTime();
                if(this.seconds <= 0) this.done();
            }, 1000);
        }

        updateTime() {
            const m = Math.floor(Math.max(0, this.seconds) / 60).toString().padStart(2, '0');
            const s = (Math.max(0, this.seconds) % 60).toString().padStart(2, '0');
            const el = document.getElementById('ui-time');
            el.innerText = `${m}:${s}`;
            el.style.color = this.seconds <= 10 ? 'var(--red)' : 'white';
        }

        done() {
            this.live = false; clearInterval(this.clock);
            this.save(); this.showEnd(true);
        }

        showHistory() { this.showEnd(false); }

        showEnd(isOver) {
            const txt = document.getElementById('status-text');
            const sum = document.getElementById('sum-box');
            const btn = document.getElementById('btn-again');
            if(isOver) {
                txt.innerText = "Game Over"; txt.style.color = "var(--red)";
                sum.style.display = "block"; btn.style.display = "flex";
                document.getElementById('ui-final').innerText = this.score;
            } else {
                txt.innerText = "Scores"; txt.style.color = "var(--accent)";
                sum.style.display = "none"; btn.style.display = "none";
            }
            this.nav('scr-results'); this.renderList();
        }

        save() {
            if(this.score <= 0) return;
            const log = JSON.parse(localStorage.getItem('bs-final-data')) || [];
            log.push({ val: this.score, stg: this.stage, key: this.lvls[this.mode].key });
            log.sort((a,b) => b.val - a.val);
            localStorage.setItem('bs-final-data', JSON.stringify(log.slice(0, 20)));
        }

        renderList() {
            const box = document.getElementById('ui-list');
            const log = JSON.parse(localStorage.getItem('bs-final-data')) || [];
            box.innerHTML = '';
            if(log.length === 0) {
                box.innerHTML += '<p style="color:#444; text-align:center; padding:20px;">No records yet.</p>';
            } else {
                log.forEach((r, i) => {
                    box.innerHTML += `<div class="row"><span>#${i+1} ${r.key} (Stage ${r.stg})</span><span style="font-weight:900; color:var(--green);">${r.val.toLocaleString()}</span></div>`;
                });
            }
        }
    }
    const game = new GameEngine();
</script>
</body>
</html>
